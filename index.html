<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>বাজার বন্ধু – ক্রেতা ও বিক্রেতার বিশ্বস্ত মার্কেটপ্লেস</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f3;--sf:#fff;--tx:#14241c;--mu:#5d6f65;--br:#0b6b4f;--br2:#08523c;--ac:#f2a900;--ln:#dbe5df;--wash:#e6f1ea;--dn:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1612;--sf:#16211b;--tx:#e8f0eb;--mu:#93a79b;--br:#2fae85;--br2:#26936f;--ln:#26362d;--wash:#1b2a22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1612;--sf:#16211b;--tx:#e8f0eb;--mu:#93a79b;--br:#2fae85;--br2:#26936f;--ln:#26362d;--wash:#1b2a22;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--br);color:#fff}
.bar{max-width:1120px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:700;font-size:1.45rem;display:flex;align-items:center;gap:8px}
.logo i{font-style:normal;background:var(--ac);color:#3a2900;border-radius:8px;padding:0 8px}
.search{flex:1;min-width:180px}
.search input{width:100%;padding:9px 14px;border-radius:10px;border:0;background:#fff;color:#14241c}
nav{display:flex;gap:4px;align-items:center}
nav button{background:none;border:0;color:#fff;padding:8px 12px;border-radius:8px;opacity:.85}
nav button.on{background:rgba(255,255,255,.18);opacity:1;font-weight:600}
.cartbtn{background:var(--ac)!important;color:#3a2900!important;font-weight:600;opacity:1!important}
main{max-width:1120px;margin:auto;padding:18px 16px 60px}
.hero{background:var(--br2);color:#fff;border-radius:16px;padding:26px 24px;margin-bottom:18px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.hero h1{margin:0 0 6px;font-size:1.7rem;line-height:1.25}.hero p{margin:0;opacity:.85;max-width:46ch}
.hero .tot{background:rgba(255,255,255,.12);border-radius:12px;padding:12px 18px;min-width:200px}
.hero .tot b{display:block;font-size:1.8rem;color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.chip{white-space:nowrap;border:1px solid var(--ln);background:var(--sf);padding:6px 14px;border-radius:99px}
.chip.on{background:var(--br);color:#fff;border-color:var(--br)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{background:var(--wash);font-size:3.4rem;text-align:center;padding:22px 0}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb h3{margin:0;font-size:1.05rem}.mu{color:var(--mu);font-size:.88rem}
.price{font-weight:700;font-size:1.2rem;color:var(--br)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;gap:8px}
.btn{background:var(--br);color:#fff;border:0;border-radius:9px;padding:8px 14px;font-weight:600}
.btn:hover{background:var(--br2)}.btn.ghost{background:var(--wash);color:var(--br)}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px 16px}
.stat.big{background:var(--br);color:#fff;border-color:var(--br)}.stat.big .mu{color:#d6efe4}
.stat b{display:block;font-size:1.7rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.bars div.l{display:flex;justify-content:space-between;font-size:.9rem;margin-top:10px}
.bars .t{height:10px;background:var(--wash);border-radius:6px;overflow:hidden}.bars .t span{display:block;height:100%;background:var(--ac)}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:500}
form{display:grid;gap:12px;max-width:520px}label{display:grid;gap:4px;font-weight:500}
input,select{padding:9px 12px;border:1px solid var(--ln);border-radius:9px;background:var(--bg)}
#drawer{position:fixed;inset:0 0 0 auto;width:min(400px,100%);background:var(--sf);z-index:40;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px)}
#drawer.open{transform:none}
#drawer .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--ln)}
#items{flex:1;overflow:auto;padding:8px 16px}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.it .e{font-size:1.8rem}.it .n{flex:1}
.q button{width:26px;height:26px;border-radius:7px;border:1px solid var(--ln);background:var(--bg)}
#drawer .ft{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}
.empty{text-align:center;color:var(--mu);padding:30px}
footer{text-align:center;color:var(--mu);padding:20px;font-size:.88rem}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo"><i>বা</i>বাজার বন্ধু</div>
  <div class="search"><input id="q" type="search" placeholder="পণ্য, ক্যাটাগরি বা বিক্রেতা খুঁজুন…" aria-label="পণ্য খুঁজুন"></div>
  <nav>
    <button data-v="shop" class="on">বাজার</button>
    <button data-v="sell">বিক্রি করুন</button>
    <button data-v="dash">ড্যাশবোর্ড</button>
    <button class="cartbtn" id="cartBtn">🛒 কার্ট (<span id="cc">০</span>)</button>
  </nav>
</div></header>

<main id="app"></main>
<footer>© বাজার বন্ধু — বিশ্বস্ত ক্রয়-বিক্রয়ের ঠিকানা</footer>

<aside id="drawer" aria-label="কার্ট">
  <div class="hd"><b>আপনার কার্ট</b><button class="btn ghost" id="closeCart">বন্ধ করুন</button></div>
  <div id="items"></div>
  <div class="ft"><div class="row" style="margin:0 0 10px"><span>মোট</span><b id="ct" style="font-size:1.3rem">৳০</b></div>
  <button class="btn" style="width:100%" id="buy">অর্ডার নিশ্চিত করুন</button></div>
</aside>
<div id="toast" role="status"></div>

<script>
var CATS=["সব","ইলেকট্রনিক্স","ফ্যাশন","মুদি ও খাদ্য","গৃহসামগ্রী","বই ও স্টেশনারি","স্বাস্থ্য ও সৌন্দর্য","খেলনা","যানবাহন"];
var SEED=[
{n:"স্মার্টফোন (৬/১২৮ জিবি)",c:"ইলেকট্রনিক্স",p:18500,s:"টেক জোন",e:"📱"},
{n:"ব্লুটুথ হেডফোন",c:"ইলেকট্রনিক্স",p:1450,s:"টেক জোন",e:"🎧"},
{n:"ল্যাপটপ (কোর i5)",c:"ইলেকট্রনিক্স",p:52000,s:"ডিজিটাল হাট",e:"💻"},
{n:"সুতির পাঞ্জাবি",c:"ফ্যাশন",p:1250,s:"রূপসা ফ্যাশন",e:"👘"},
{n:"জামদানি শাড়ি",c:"ফ্যাশন",p:6800,s:"তাঁতঘর",e:"🥻"},
{n:"চামড়ার জুতা",c:"ফ্যাশন",p:2200,s:"পদক্ষেপ",e:"👞"},
{n:"চিনিগুঁড়া চাল (৫ কেজি)",c:"মুদি ও খাদ্য",p:650,s:"কৃষক বাজার",e:"🌾"},
{n:"সুন্দরবনের মধু (৫০০ গ্রাম)",c:"মুদি ও খাদ্য",p:720,s:"প্রকৃতির দান",e:"🍯"},
{n:"হিমসাগর আম (৫ কেজি)",c:"মুদি ও খাদ্য",p:600,s:"রাজশাহী ফার্ম",e:"🥭"},
{n:"রাইস কুকার (১.৮ লিটার)",c:"গৃহসামগ্রী",p:3200,s:"ঘরের সাজ",e:"🍚"},
{n:"আরামদায়ক সোফা (৩ সিটার)",c:"গৃহসামগ্রী",p:24000,s:"আসবাব মহল",e:"🛋️"},
{n:"বাংলা উপন্যাস সংকলন",c:"বই ও স্টেশনারি",p:480,s:"বইঘর",e:"📚"},
{n:"স্কুল ব্যাগ",c:"বই ও স্টেশনারি",p:950,s:"বইঘর",e:"🎒"},
{n:"ফেসওয়াশ ও ময়েশ্চারাইজার সেট",c:"স্বাস্থ্য ও সৌন্দর্য",p:890,s:"সুস্থ জীবন",e:"🧴"},
{n:"রিমোট কন্ট্রোল গাড়ি",c:"খেলনা",p:1350,s:"শিশুমেলা",e:"🚗"},
{n:"হেলমেট (ISI মান)",c:"যানবাহন",p:1800,s:"রাইডার্স পয়েন্ট",e:"🪖"}
].map(function(x,i){x.id=i+1;return x});
var st={products:SEED.slice(),orders:[],cart:{},view:"shop",cat:"সব",qs:""};
try{var sv=JSON.parse(localStorage.getItem("bb_state")||"null");if(sv&&sv.products){st.products=sv.products;st.orders=sv.orders||[]}}catch(e){}
function save(){try{localStorage.setItem("bb_state",JSON.stringify({products:st.products,orders:st.orders}))}catch(e){}}
var bn=function(n){return Number(n).toLocaleString("bn-BD")};
var tk=function(n){return "৳"+bn(n)};
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("show")},2200)}
function total(){return st.orders.reduce(function(a,o){return a+o.total},0)}

function render(){
  document.querySelectorAll("nav [data-v]").forEach(function(b){b.classList.toggle("on",b.dataset.v===st.view)});
  var a=$("#app");
  if(st.view==="shop")a.innerHTML=shop();else if(st.view==="sell")a.innerHTML=sell();else a.innerHTML=dash();
  if(st.view==="sell")bindSell();
  cartUI();
}
function shop(){
  var q=st.qs.trim().toLowerCase();
  var list=st.products.filter(function(p){return(st.cat==="সব"||p.c===st.cat)&&(!q||(p.n+p.c+p.s).toLowerCase().indexOf(q)>-1)});
  return '<section class="hero"><div><h1>দেশের সেরা পণ্য, এক জায়গায়</h1><p>যাচাইকৃত বিক্রেতার কাছ থেকে সরাসরি কিনুন। আপনার পণ্য বিক্রি করতে “বিক্রি করুন” ট্যাবে যান।</p></div>'+
  '<div class="tot"><span>এ পর্যন্ত মোট ক্রয়</span><b>'+tk(total())+'</b><span>'+bn(st.orders.length)+'টি অর্ডার</span></div></section>'+
  '<div class="chips">'+CATS.map(function(c){return '<button class="chip'+(c===st.cat?' on':'')+'" data-cat="'+c+'">'+c+'</button>'}).join("")+'</div>'+
  (list.length?'<div class="grid">'+list.map(function(p){return '<article class="card"><div class="pic" aria-hidden="true">'+esc(p.e)+'</div><div class="cb"><span class="mu">'+esc(p.c)+'</span><h3>'+esc(p.n)+'</h3><span class="mu">বিক্রেতা: '+esc(p.s)+'</span><div class="row"><span class="price">'+tk(p.p)+'</span><button class="btn" data-add="'+p.id+'">কার্টে দিন</button></div></div></article>'}).join("")+'</div>':'<div class="empty">কোনো পণ্য পাওয়া যায়নি। অন্য শব্দ বা ক্যাটাগরি চেষ্টা করুন।</div>');
}
function sell(){
  return '<div class="panel"><h2 style="margin-top:0">আপনার পণ্য বিক্রির জন্য তুলুন</h2><form id="sf">'+
  '<label>পণ্যের নাম<input name="n" required maxlength="60"></label>'+
  '<label>ক্যাটাগরি<select name="c">'+CATS.slice(1).map(function(c){return '<option>'+c+'</option>'}).join("")+'</select></label>'+
  '<label>দাম (টাকা)<input name="p" type="number" min="1" required></label>'+
  '<label>বিক্রেতার নাম / দোকান<input name="s" required maxlength="40"></label>'+
  '<label>ইমোজি আইকন (ঐচ্ছিক)<input name="e" maxlength="4" placeholder="🛍️"></label>'+
  '<button class="btn" type="submit">পণ্য প্রকাশ করুন</button></form></div>';
}
function bindSell(){
  $("#sf").addEventListener("submit",function(ev){
    ev.preventDefault();var f=new FormData(ev.target);
    st.products.unshift({id:Date.now(),n:f.get("n"),c:f.get("c"),p:+f.get("p"),s:f.get("s"),e:f.get("e")||"🛍️"});
    save();toast("পণ্য প্রকাশিত হয়েছে");st.view="shop";st.cat="সব";render();
  });
}
function dash(){
  var o=st.orders,t=total(),by={};
  o.forEach(function(x){x.lines.forEach(function(l){by[l.c]=(by[l.c]||0)+l.p*l.q})});
  var keys=Object.keys(by).sort(function(a,b){return by[b]-by[a]}),mx=keys.length?by[keys[0]]:1;
  var avg=o.length?Math.round(t/o.length):0,units=o.reduce(function(a,x){return a+x.lines.reduce(function(s,l){return s+l.q},0)},0);
  return '<h2 style="margin:0 0 12px">বিক্রয় ও ক্রয়ের ড্যাশবোর্ড</h2>'+
  '<div class="stats"><div class="stat big"><span class="mu">মোট ক্রয়ের পরিমাণ</span><b>'+tk(t)+'</b></div>'+
  '<div class="stat"><span class="mu">মোট অর্ডার</span><b>'+bn(o.length)+'</b></div>'+
  '<div class="stat"><span class="mu">গড় অর্ডার মূল্য</span><b>'+tk(avg)+'</b></div>'+
  '<div class="stat"><span class="mu">বিক্রিত পণ্য / তালিকাভুক্ত</span><b>'+bn(units)+' / '+bn(st.products.length)+'</b></div></div>'+
  '<div class="two"><div class="panel"><b>ক্যাটাগরি অনুযায়ী ক্রয়</b><div class="bars">'+
  (keys.length?keys.map(function(k){return '<div class="l"><span>'+esc(k)+'</span><b>'+tk(by[k])+'</b></div><div class="t"><span style="width:'+Math.round(by[k]/mx*100)+'%"></span></div>'}).join(""):'<div class="empty">এখনও কোনো ক্রয় হয়নি। বাজার থেকে প্রথম অর্ডারটি দিন।</div>')+
  '</div></div><div class="panel"><b>সাম্প্রতিক অর্ডার</b><div class="tbl">'+
  (o.length?'<table><tr><th>অর্ডার</th><th>সময়</th><th>পণ্য</th><th>মোট</th></tr>'+o.slice(0,8).map(function(x){return '<tr><td>#'+bn(x.no)+'</td><td>'+esc(x.at)+'</td><td>'+bn(x.lines.length)+'টি</td><td><b>'+tk(x.total)+'</b></td></tr>'}).join("")+'</table>':'<div class="empty">কোনো অর্ডার নেই।</div>')+
  '</div></div></div>';
}
function cartUI(){
  var ids=Object.keys(st.cart),n=0,sum=0;
  var h=ids.map(function(id){var p=st.products.find(function(x){return x.id==id});if(!p)return"";var q=st.cart[id];n+=q;sum+=p.p*q;
    return '<div class="it"><span class="e">'+esc(p.e)+'</span><div class="n"><div>'+esc(p.n)+'</div><span class="mu">'+tk(p.p)+'</span></div><div class="q"><button data-dec="'+id+'" aria-label="কমান">−</button> '+bn(q)+' <button data-inc="'+id+'" aria-label="বাড়ান">+</button></div></div>'}).join("");
  $("#items").innerHTML=h||'<div class="empty">কার্ট খালি। পছন্দের পণ্য যোগ করুন।</div>';
  $("#cc").textContent=bn(n);$("#ct").textContent=tk(sum);$("#buy").disabled=!n;
}
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.v){st.view=t.dataset.v;render();window.scrollTo(0,0)}
  else if(t.dataset.cat){st.cat=t.dataset.cat;render()}
  else if(t.dataset.add){st.cart[t.dataset.add]=(st.cart[t.dataset.add]||0)+1;cartUI();toast("কার্টে যোগ হয়েছে")}
  else if(t.dataset.inc){st.cart[t.dataset.inc]++;cartUI()}
  else if(t.dataset.dec){if(--st.cart[t.dataset.dec]<1)delete st.cart[t.dataset.dec];cartUI()}
  else if(t.id==="cartBtn")$("#drawer").classList.add("open");
  else if(t.id==="closeCart")$("#drawer").classList.remove("open");
  else if(t.id==="buy"){
    var lines=[],sum=0;
    Object.keys(st.cart).forEach(function(id){var p=st.products.find(function(x){return x.id==id});if(p){lines.push({n:p.n,c:p.c,p:p.p,q:st.cart[id]});sum+=p.p*st.cart[id]}});
    if(!lines.length)return;
    st.orders.unshift({no:st.orders.length+1,at:new Date().toLocaleString("bn-BD",{dateStyle:"short",timeStyle:"short"}),lines:lines,total:sum});
    st.cart={};save();$("#drawer").classList.remove("open");toast("অর্ডার সম্পন্ন: "+tk(sum));st.view="dash";render();window.scrollTo(0,0);
  }
});
$("#q").addEventListener("input",function(e){st.qs=e.target.value;if(st.view!=="shop")st.view="shop";render()});
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
