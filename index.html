<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8590c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<title>বাজার বন্ধু – ক্রেতা ও বিক্রেতার বিশ্বস্ত মার্কেটপ্লেস</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7f1;--sf:#fff;--tx:#2b1d16;--mu:#7a6a60;--br:#e8590c;--br2:#c2410c;--ac:#ffd21f;--ln:#f1ddd0;--wash:#ffeadb;--dn:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a120d;--sf:#251a14;--tx:#f5ebe4;--mu:#b9a89c;--br:#ff8a3d;--br2:#f97316;--ln:#3a2a20;--wash:#34241a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a120d;--sf:#251a14;--tx:#f5ebe4;--mu:#b9a89c;--br:#ff8a3d;--br2:#f97316;--ln:#3a2a20;--wash:#34241a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--br);color:#fff}
.bar{max-width:1120px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:700;font-size:1.45rem;display:flex;align-items:center;gap:8px}
.logo i{font-style:normal;background:var(--ac);color:#3a2900;border-radius:8px;padding:0 8px}
.search{flex:1;min-width:180px}
.search input{width:100%;padding:9px 14px;border-radius:10px;border:0;background:#fff;color:#14241c}
nav{display:flex;gap:4px;align-items:center}
nav button{background:none;border:0;color:#fff;padding:8px 12px;border-radius:8px;opacity:.85}
nav button.on{background:rgba(255,255,255,.18);opacity:1;font-weight:600}
.cartbtn{background:var(--ac)!important;color:#3a2900!important;font-weight:600;opacity:1!important}
main{max-width:1120px;margin:auto;padding:18px 16px 60px}
.hero{background:var(--br2);color:#fff;border-radius:16px;padding:26px 24px;margin-bottom:18px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.hero h1{margin:0 0 6px;font-size:1.7rem;line-height:1.25}.hero p{margin:0;opacity:.85;max-width:46ch}
.hero .tot{background:rgba(255,255,255,.12);border-radius:12px;padding:12px 18px;min-width:200px}
.hero .tot b{display:block;font-size:1.8rem;color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.chip{white-space:nowrap;border:1px solid var(--ln);background:var(--sf);padding:6px 14px;border-radius:99px}
.chip.on{background:var(--br);color:#fff;border-color:var(--br)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{background:var(--wash);font-size:3.4rem;text-align:center;padding:22px 0}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb h3{margin:0;font-size:1.05rem}.mu{color:var(--mu);font-size:.88rem}
.price{font-weight:700;font-size:1.2rem;color:var(--br)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;gap:8px}
.btn{background:var(--br);color:#fff;border:0;border-radius:9px;padding:8px 14px;font-weight:600}
.btn:hover{background:var(--br2)}.btn.ghost{background:var(--wash);color:var(--br)}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px 16px}
.stat.big{background:var(--br);color:#fff;border-color:var(--br)}.stat.big .mu{color:#d6efe4}
.stat b{display:block;font-size:1.7rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.bars div.l{display:flex;justify-content:space-between;font-size:.9rem;margin-top:10px}
.bars .t{height:10px;background:var(--wash);border-radius:6px;overflow:hidden}.bars .t span{display:block;height:100%;background:var(--ac)}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:500}
form{display:grid;gap:12px;max-width:520px}label{display:grid;gap:4px;font-weight:500}
input,select{padding:9px 12px;border:1px solid var(--ln);border-radius:9px;background:var(--bg)}
#drawer{position:fixed;inset:0 0 0 auto;width:min(400px,100%);background:var(--sf);z-index:40;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px)}
#drawer.open{transform:none}
#drawer:not(.open){visibility:hidden;transition:transform .25s,visibility 0s .25s}
#drawer .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--ln)}
#items{flex:1;overflow:auto;padding:8px 16px}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.it .e{font-size:1.8rem}.it .n{flex:1}
.q button{width:26px;height:26px;border-radius:7px;border:1px solid var(--ln);background:var(--bg)}
#drawer .ft{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln)}
#chkForm{max-width:none;flex:1;overflow:auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));align-content:start}
#chkForm[hidden]{display:none}
.rad{display:flex;align-items:center;gap:8px;font-weight:400}.rad input{width:auto;padding:0}
fieldset{border:1px solid var(--ln);border-radius:10px;padding:10px 12px;display:grid;gap:8px;margin:0}legend{color:var(--mu);font-size:.88rem;padding:0 6px}
.err{color:#b3261e;font-size:.92rem;min-height:1.2em}
.det{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}@media(max-width:760px){.det{grid-template-columns:1fr}}
.det .big{background:var(--wash);border-radius:16px;font-size:7rem;text-align:center;padding:40px 0;transition:background .2s}
.det h2{margin:0 0 4px}.det .price{font-size:1.6rem;display:block;margin:6px 0 10px}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.sw{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ln);background:var(--sf);border-radius:99px;padding:5px 12px 5px 6px}
.sw i{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.25);display:inline-block}
.sw[aria-pressed="true"],.sz[aria-pressed="true"]{border-color:var(--br);background:var(--wash);font-weight:600}
.sz{border:2px solid var(--ln);background:var(--sf);border-radius:9px;padding:5px 14px}
.stk{font-size:.9rem;margin:2px 0 10px}.stk.low{color:#b3261e}.stk.ok{color:var(--br)}
.qty{display:inline-flex;align-items:center;gap:10px;margin:4px 0 14px}
.qty button{width:34px;height:34px;border-radius:9px;border:1px solid var(--ln);background:var(--bg);font-size:1.1rem}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.8rem;background:var(--wash);color:var(--br)}
.badge.warn{background:#fdecc8;color:#6b4a00}
.card .pic,.card h3{cursor:pointer}
.pay{background:var(--wash);border-radius:10px;padding:10px 12px;display:grid;gap:8px}.pay[hidden]{display:none}
.pay .num{font-weight:700;font-size:1.05rem;letter-spacing:.5px}
.ok-box{text-align:center;max-width:520px;margin:30px auto}.ok-box .tick{font-size:3.5rem}
header{position:static;color:var(--tx);border-radius:0;background:radial-gradient(circle at 0 0,#ff7a18 0,#ff7a18 13%,transparent 36%),radial-gradient(circle at 100% 0,#ff8a00 0,#ff6a00 11%,transparent 32%),var(--bg)}
.logo{background:#fff;border-radius:22px;padding:6px 14px 6px 8px;box-shadow:0 2px 10px rgba(0,0,0,.12);justify-self:start;color:#1f3a93}
.bar{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 16px 16px}
.logo b{display:block;font-size:1.4rem;line-height:1.1;color:#1f3a93}.logo em{font-style:normal;color:#e8410c}.logo small{display:block;font-size:.7rem;font-weight:400;color:#5d5d5d}
.hb{display:flex;gap:8px}.hb button{width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.14);font-size:1.15rem}
.search{grid-column:1/-1;display:flex;gap:8px;min-width:0}.search input{flex:1;min-width:0;padding:12px 18px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
#flt{width:46px;border-radius:50%;border:0;background:var(--br);color:#fff;font-size:1.1rem}
.role{display:flex;margin:12px 16px 0;border:2px solid var(--br);border-radius:99px;background:var(--sf);overflow:hidden;max-width:520px}
.role button{flex:1;border:0;background:none;padding:10px;font-weight:700;font-size:1.05rem;color:var(--tx)}.role button[aria-pressed=true]{background:var(--br);color:#fff}
body.seller .search{display:none}body.seller .b,body:not(.seller) .s{display:none!important}
#app{padding-bottom:100px}
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sf);border-radius:22px 22px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.14);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
nav.bn button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.78rem;color:var(--mu);position:relative;padding:2px 10px;font-family:inherit}
nav.bn button:focus-visible{outline:3px solid var(--ac)}nav.bn i{font-style:normal;font-size:1.4rem}nav.bn button.on{color:var(--br);font-weight:700}
nav.bn em{position:absolute;top:-4px;right:2px;background:#e53935;color:#fff;border-radius:99px;font-size:.7rem;font-style:normal;padding:0 6px}
.bnr{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px 0 6px;border-radius:20px;scrollbar-width:none}.bnr::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:start;min-height:170px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff}
.sl h2{margin:0 0 10px;font-size:1.25rem;line-height:1.3}.sl .cta{background:#ffd21f;color:#3a2900;border:0;border-radius:99px;padding:8px 16px;font-weight:700}.sl .em{font-size:4.5rem}
.dots{display:flex;justify-content:center;gap:6px;margin:6px 0 14px}.dots i{width:26px;height:6px;border-radius:9px;background:var(--ln)}.dots i.on{background:var(--br)}
.cats{display:flex;overflow-x:auto;background:var(--sf);border-radius:18px;padding:10px 4px;box-shadow:0 2px 10px rgba(0,0,0,.08);scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.tile{flex:0 0 78px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.76rem;text-align:center;line-height:1.2;padding:2px}
.tile span{width:52px;height:52px;border-radius:50%;background:#e3f0ff;display:grid;place-items:center;font-size:1.6rem}.tile:nth-child(3n+2) span{background:#ffe1e8}.tile:nth-child(3n) span{background:#ffeccf}
.tile[aria-pressed=true] span{outline:3px solid var(--br)}
.hd2{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.hd2 h2{margin:0;font-size:1.25rem}
.hrow{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px}.hrow .pc{flex:0 0 44%;scroll-snap-align:start}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.pg{grid-template-columns:repeat(4,1fr)}.hrow .pc{flex-basis:200px}}
.pc{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:10px;position:relative;min-width:0}
.pc .pi{background:var(--wash);border-radius:12px;font-size:3.2rem;text-align:center;padding:14px 0;cursor:pointer}
.pc h3{margin:8px 0 0;font-size:.95rem;line-height:1.3;cursor:pointer}.pc .pr{font-weight:700;font-size:1.05rem;padding-right:40px}
.pc .add{position:absolute;right:8px;bottom:8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--br);color:#fff}.pc .add:disabled{background:var(--mu)}
.offer{margin:18px 0;border-radius:18px;padding:16px;background:linear-gradient(100deg,#ffd54a,#ffb300);color:#4a2f00;display:flex;justify-content:space-between;align-items:center}
.bar{grid-template-columns:1fr auto 1fr}.logo{justify-self:center}.hb{justify-self:end}.hb button{position:relative}
.hb em{position:absolute;top:-2px;right:-2px;background:#e53935;color:#fff;border-radius:99px;font-size:.7rem;font-style:normal;padding:0 5px}
#sb{border:0;border-radius:99px;background:var(--br);color:#fff;font-weight:700;padding:0 20px}
nav.bn button.plus{margin-top:-30px;color:var(--tx);font-weight:700}nav.bn button.plus i{width:58px;height:58px;border-radius:50%;background:var(--br);color:#fff;display:grid;place-items:center;font-size:2rem;box-shadow:0 4px 12px rgba(0,0,0,.28)}
.promo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.pm{border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px;min-height:140px;color:#14241c}
.pm.g{background:linear-gradient(135deg,#d9f2d9,#b7e8b0)}.pm.o{background:linear-gradient(135deg,#ffe2c7,#ffc896)}.pm .ic{font-size:2rem}.pm small{color:#44524a}
.pm button{margin-top:auto;border:0;border-radius:10px;padding:8px;color:#fff;font-weight:700}.pm.g button{background:#2a8a32}.pm.o button{background:#e8590c}
.pc .pi{position:relative}.dt{position:absolute;top:6px;right:6px;background:#e53935;color:#fff;border-radius:8px;font-size:.75rem;font-weight:700;padding:1px 7px;font-family:inherit}
.pc s{font-weight:400;font-size:.8rem;color:var(--mu)}.hd2 h2.rib{background:#e53935;color:#fff;padding:6px 20px 6px 12px;border-radius:12px 0 22px 0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 8px}.logo{margin:0 auto;padding:6px 16px 6px 10px;gap:8px;border-radius:26px}.logo img{display:block;height:46px;width:auto}
.logo b{font-size:1.75rem;line-height:.95;font-weight:800;letter-spacing:-.5px;font-family:Arial,"Hind Siliguri",sans-serif;color:#1b3a8f}.logo .w2{color:#e4161f}
.logo small{font-size:.58rem;margin-top:3px;white-space:nowrap}.search{flex:1 1 100%;position:relative}
.si{position:absolute;left:16px;top:50%;transform:translateY(-50%);z-index:1}.search input{padding-left:44px}
.role button{font-size:1.2rem;padding:12px}
.dots{margin:-26px 0 18px;position:relative;z-index:1}.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.55)}.dots i.on{background:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}
.empty{text-align:center;color:var(--mu);padding:30px}
footer{text-align:center;color:var(--mu);padding:20px;font-size:.88rem}
</style>
</head>

  else if(t.dataset.note)toast("নতুন কোনো নোটিফিকেশন নেই")
  else if(t.id==="sb"){st.view="shop";render();var rs=document.getElementById("res");if(rs)rs.scrollIntoView({behavior:"smooth"})}
  else if(t.id==="flt"){var so=["new","asc","desc"],nm={"new":"নতুন আগে",asc:"কম দাম আগে",desc:"বেশি দাম আগে"};st.sort=so[(so.indexOf(st.sort)+1)%3];st.view="shop";render();toast("সাজানো: "+nm[st.sort])}
  else if(t.dataset.add){
    var pa=st.products.find(function(x){return x.id==t.dataset.add});if(!pa)return;
    if((pa.cl&&pa.cl.length)||(pa.sz&&pa.sz.length)){st.pid=pa.id;st.sel={c:null,z:null,q:1};st.view="item";render();window.scrollTo(0,0);toast("রং/সাইজ বেছে কার্টে দিন")}
    else if(inCart(pa)>=left(pa)){toast("এর বেশি স্টকে নেই")}
    else{var k0=ck(pa.id,"","");st.cart[k0]=(st.cart[k0]||0)+1;save();cartUI();toast("কার্টে যোগ হয়েছে")}
  }
  else if(t.dataset.open){st.pid=+t.dataset.open;st.sel={c:null,z:null,q:1};st.view="item";render();window.scrollTo(0,0)}
  else if(t.dataset.color){st.sel.c=t.dataset.color;render()}
  else if(t.dataset.size){st.sel.z=t.dataset.size;render()}
  else if(t.dataset.q){var pr=st.products.find(function(x){return x.id==st.pid}),mxq=Math.max(1,left(pr)-inCart(pr));st.sel.q=Math.min(mxq,Math.max(1,st.sel.q+ +t.dataset.q));$("#qv").textContent=bn(st.sel.q)}
  else if(t.dataset.addv){
    var pr2=st.products.find(function(x){return x.id==st.pid}),er=$("#itemErr");
    if(pr2.cl&&pr2.cl.length&&!st.sel.c){er.textContent="আগে একটি রং বাছুন।";return}
    if(pr2.sz&&pr2.sz.length&&!st.sel.z){er.textContent="আগে সাইজ বাছুন।";return}
    if(left(pr2)-inCart(pr2)<st.sel.q){er.textContent="দুঃখিত, এর বেশি স্টকে নেই।";return}
    var key=ck(pr2.id,st.sel.c,st.sel.z);st.cart[key]=(st.cart[key]||0)+st.sel.q;save();cartUI();
    if(t.dataset.addv==="buy"){openCart();startCheckout()}else{toast("কার্টে যোগ হয়েছে");st.sel.q=1;render()}
  }
  else if(t.dataset.inc){var iv=byKey(t.dataset.inc);if(iv.p&&inCart(iv.p)<left(iv.p)){st.cart[t.dataset.inc]++;save();cartUI()}else toast("এর বেশি স্টকে নেই")}
  else if(t.dataset.dec){if(--st.cart[t.dataset.dec]<1)delete st.cart[t.dataset.dec];save();cartUI()}
  else if(t.id==="cartBtn")openCart();
  else if(t.id==="closeCart")closeCart();
  else if(t.id==="buy"){if(Object.keys(st.cart).length)startCheckout()}
  else if(t.id==="backCart")setStep("cart");
});
$("#q").addEventListener("input",function(e){st.qs=e.target.value;if(st.view!=="shop")st.view="shop";render()});
document.addEventListener("scroll",function(e){var b=e.target;if(b.classList&&b.classList.contains("bnr")){var i=Math.round(b.scrollLeft/b.clientWidth);document.querySelectorAll(".dots i").forEach(function(d,k){d.classList.toggle("on",k===i)})}},true);
if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches)setInterval(function(){var b=document.querySelector(".bnr");if(!b||st.view!=="shop"||document.hidden)return;b.scrollTo({left:((Math.round(b.scrollLeft/b.clientWidth)+1)%3)*b.clientWidth,behavior:"smooth"})},4500);
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
