<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<title>বাজার বন্ধু – ক্রেতা ও বিক্রেতার বিশ্বস্ত মার্কেটপ্লেস</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f3;--sf:#fff;--tx:#14241c;--mu:#5d6f65;--br:#0b6b4f;--br2:#08523c;--ac:#f2a900;--ln:#dbe5df;--wash:#e6f1ea;--dn:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1612;--sf:#16211b;--tx:#e8f0eb;--mu:#93a79b;--br:#2fae85;--br2:#26936f;--ln:#26362d;--wash:#1b2a22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1612;--sf:#16211b;--tx:#e8f0eb;--mu:#93a79b;--br:#2fae85;--br2:#26936f;--ln:#26362d;--wash:#1b2a22;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--br);color:#fff}
.bar{max-width:1120px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:700;font-size:1.45rem;display:flex;align-items:center;gap:8px}
.logo i{font-style:normal;background:var(--ac);color:#3a2900;border-radius:8px;padding:0 8px}
.search{flex:1;min-width:180px}
.search input{width:100%;padding:9px 14px;border-radius:10px;border:0;background:#fff;color:#14241c}
nav{display:flex;gap:4px;align-items:center}
nav button{background:none;border:0;color:#fff;padding:8px 12px;border-radius:8px;opacity:.85}
nav button.on{background:rgba(255,255,255,.18);opacity:1;font-weight:600}
.cartbtn{background:var(--ac)!important;color:#3a2900!important;font-weight:600;opacity:1!important}
main{max-width:1120px;margin:auto;padding:18px 16px 60px}
.hero{background:var(--br2);color:#fff;border-radius:16px;padding:26px 24px;margin-bottom:18px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.hero h1{margin:0 0 6px;font-size:1.7rem;line-height:1.25}.hero p{margin:0;opacity:.85;max-width:46ch}
.hero .tot{background:rgba(255,255,255,.12);border-radius:12px;padding:12px 18px;min-width:200px}
.hero .tot b{display:block;font-size:1.8rem;color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.chip{white-space:nowrap;border:1px solid var(--ln);background:var(--sf);padding:6px 14px;border-radius:99px}
.chip.on{background:var(--br);color:#fff;border-color:var(--br)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{background:var(--wash);font-size:3.4rem;text-align:center;padding:22px 0}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb h3{margin:0;font-size:1.05rem}.mu{color:var(--mu);font-size:.88rem}
.price{font-weight:700;font-size:1.2rem;color:var(--br)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;gap:8px}
.btn{background:var(--br);color:#fff;border:0;border-radius:9px;padding:8px 14px;font-weight:600}
.btn:hover{background:var(--br2)}.btn.ghost{background:var(--wash);color:var(--br)}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px 16px}
.stat.big{background:var(--br);color:#fff;border-color:var(--br)}.stat.big .mu{color:#d6efe4}
.stat b{display:block;font-size:1.7rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.bars div.l{display:flex;justify-content:space-between;font-size:.9rem;margin-top:10px}
.bars .t{height:10px;background:var(--wash);border-radius:6px;overflow:hidden}.bars .t span{display:block;height:100%;background:var(--ac)}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:500}
form{display:grid;gap:12px;max-width:520px}label{display:grid;gap:4px;font-weight:500}
input,select{padding:9px 12px;border:1px solid var(--ln);border-radius:9px;background:var(--bg)}
#drawer{position:fixed;inset:0 0 0 auto;width:min(400px,100%);background:var(--sf);z-index:40;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px)}
#drawer.open{transform:none}
#drawer:not(.open){visibility:hidden;transition:transform .25s,visibility 0s .25s}
#drawer .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--ln)}
#items{flex:1;overflow:auto;padding:8px 16px}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.it .e{font-size:1.8rem}.it .n{flex:1}
.q button{width:26px;height:26px;border-radius:7px;border:1px solid var(--ln);background:var(--bg)}
#drawer .ft{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln)}
#chkForm{max-width:none;flex:1;overflow:auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));align-content:start}
#chkForm[hidden]{display:none}
.rad{display:flex;align-items:center;gap:8px;font-weight:400}.rad input{width:auto;padding:0}
fieldset{border:1px solid var(--ln);border-radius:10px;padding:10px 12px;display:grid;gap:8px;margin:0}legend{color:var(--mu);font-size:.88rem;padding:0 6px}
.err{color:#b3261e;font-size:.92rem;min-height:1.2em}
.det{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}@media(max-width:760px){.det{grid-template-columns:1fr}}
.det .big{background:var(--wash);border-radius:16px;font-size:7rem;text-align:center;padding:40px 0;transition:background .2s}
.det h2{margin:0 0 4px}.det .price{font-size:1.6rem;display:block;margin:6px 0 10px}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.sw{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ln);background:var(--sf);border-radius:99px;padding:5px 12px 5px 6px}
.sw i{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.25);display:inline-block}
.sw[aria-pressed="true"],.sz[aria-pressed="true"]{border-color:var(--br);background:var(--wash);font-weight:600}
.sz{border:2px solid var(--ln);background:var(--sf);border-radius:9px;padding:5px 14px}
.stk{font-size:.9rem;margin:2px 0 10px}.stk.low{color:#b3261e}.stk.ok{color:var(--br)}
.qty{display:inline-flex;align-items:center;gap:10px;margin:4px 0 14px}
.qty button{width:34px;height:34px;border-radius:9px;border:1px solid var(--ln);background:var(--bg);font-size:1.1rem}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.8rem;background:var(--wash);color:var(--br)}
.badge.warn{background:#fdecc8;color:#6b4a00}
.card .pic,.card h3{cursor:pointer}
.pay{background:var(--wash);border-radius:10px;padding:10px 12px;display:grid;gap:8px}.pay[hidden]{display:none}
.pay .num{font-weight:700;font-size:1.05rem;letter-spacing:.5px}
.ok-box{text-align:center;max-width:520px;margin:30px auto}.ok-box .tick{font-size:3.5rem}
header{position:static;background:linear-gradient(170deg,var(--br),var(--br2));border-radius:0 0 28px 28px}
.bar{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 16px 16px}
.logo b{display:block;font-size:1.4rem;line-height:1.1}.logo em{font-style:normal;color:#ffb347}.logo small{display:block;font-size:.7rem;font-weight:400;opacity:.9}
.hb{display:flex;gap:8px}.hb button{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.2);font-size:1.15rem}
.search{grid-column:1/-1;display:flex;gap:8px;min-width:0}.search input{flex:1;min-width:0;padding:12px 18px;border-radius:99px}
#flt{width:46px;border-radius:50%;border:0;background:var(--ac);font-size:1.1rem}
.role{display:flex;margin:12px 16px 0;background:var(--wash);border-radius:99px;padding:4px;max-width:480px}.role button{flex:1;border:0;background:none;padding:8px;border-radius:99px;font-weight:600}.role button[aria-pressed=true]{background:var(--br);color:#fff}
body.seller .search{display:none}body.seller .b,body:not(.seller) .s{display:none!important}
#app{padding-bottom:100px}
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sf);border-radius:22px 22px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.14);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
nav.bn button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.78rem;color:var(--mu);position:relative;padding:2px 10px;font-family:inherit}
nav.bn button:focus-visible{outline:3px solid var(--ac)}nav.bn i{font-style:normal;font-size:1.4rem}nav.bn button.on{color:var(--br);font-weight:700}
nav.bn em{position:absolute;top:-4px;right:2px;background:#e53935;color:#fff;border-radius:99px;font-size:.7rem;font-style:normal;padding:0 6px}
.bnr{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px 0 6px;border-radius:20px;scrollbar-width:none}.bnr::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:start;min-height:170px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff}
.sl h2{margin:0 0 10px;font-size:1.25rem;line-height:1.3}.sl .cta{background:#f28c28;color:#fff;border:0;border-radius:99px;padding:8px 16px;font-weight:700}.sl .em{font-size:4.5rem}
.dots{display:flex;justify-content:center;gap:6px;margin:6px 0 14px}.dots i{width:26px;height:6px;border-radius:9px;background:var(--ln)}.dots i.on{background:var(--br)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem;text-align:center;line-height:1.2}.tile span{font-size:1.7rem}.tile[aria-pressed=true]{border-color:var(--br);background:var(--wash)}
.hd2{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.hd2 h2{margin:0;font-size:1.25rem}
.hrow{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px}.hrow .pc{flex:0 0 44%;scroll-snap-align:start}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.pg{grid-template-columns:repeat(4,1fr)}.hrow .pc{flex-basis:200px}}
.pc{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:10px;position:relative;min-width:0}
.pc .pi{background:var(--wash);border-radius:12px;font-size:3.2rem;text-align:center;padding:14px 0;cursor:pointer}
.pc h3{margin:8px 0 0;font-size:.95rem;line-height:1.3;cursor:pointer}.pc .pr{font-weight:700;font-size:1.05rem;padding-right:40px}
.pc .add{position:absolute;right:8px;bottom:8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--br);color:#fff}.pc .add:disabled{background:var(--mu)}
.offer{margin:18px 0;border-radius:18px;padding:16px;background:linear-gradient(100deg,#ffd54a,#ffb300);color:#4a2f00;display:flex;justify-content:space-between;align-items:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}
.empty{text-align:center;color:var(--mu);padding:30px}
footer{text-align:center;color:var(--mu);padding:20px;font-size:.88rem}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo"><svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><path d="M14 18c0-7 4-11 10-11s10 4 10 11" fill="none" stroke="#ffb347" stroke-width="3.5" stroke-linecap="round"/><rect x="6" y="17" width="36" height="26" rx="6" fill="#fff"/><text x="24" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#0b6b4f" font-family="Arial,sans-serif">B</text></svg><span><b>Bazar<em>Bondhu</em></b><small>Buy • Sell • Grow Together</small></span></div>
  <div class="hb"><button id="bell" aria-label="নোটিফিকেশন">🔔</button><button data-v="dash" aria-label="প্রোফাইল ও অর্ডার">👤</button></div>
  <div class="search"><input id="q" type="search" placeholder="কী খুঁজছেন?" aria-label="পণ্য খুঁজুন"><button id="flt" aria-label="সাজান">⚙️</button></div>
</div></header>
<div class="role" role="group" aria-label="আপনি কে"><button data-role="buyer" aria-pressed="true">🛒 ক্রেতা</button><button data-role="seller" aria-pressed="false">🏪 বিক্রেতা</button></div>

<main id="app"></main>
<nav class="bn" aria-label="প্রধান মেনু">
  <button data-v="shop" class="b"><i>🏠</i><span>হোম</span></button>
  <button data-go="cats" class="b"><i>▦</i><span>ক্যাটাগরি</span></button>
  <button id="cartBtn" class="b"><i>🛒</i><span>কার্ট</span><em id="cc" hidden>০</em></button>
  <button data-v="dash" class="b"><i>👤</i><span>প্রোফাইল</span></button>
  <button data-v="sdash" class="s"><i>📊</i><span>আমার দোকান</span></button>
  <button data-v="sell" class="s"><i>➕</i><span>পণ্য তুলুন</span></button>
  <button data-role="buyer" class="s"><i>🛍️</i><span>কেনাকাটা</span></button>
</nav>
<footer hidden>© বাজার বন্ধু — বিশ্বস্ত ক্রয়-বিক্রয়ের ঠিকানা</footer>

<aside id="drawer" aria-label="কার্ট" aria-hidden="true" inert>
  <div class="hd"><b id="dt">আপনার কার্ট</b><button class="btn ghost" id="closeCart">বন্ধ করুন</button></div>
  <div id="items"></div>
  <div class="ft" id="cartFt"><div class="row" style="margin:0 0 10px"><span>মোট</span><b id="ct" style="font-size:1.3rem">৳০</b></div>
  <button class="btn" style="width:100%" id="buy">চেকআউটে যান</button></div>
  <form id="chkForm" hidden novalidate>
    <div class="panel" style="padding:12px"><b>অর্ডারের সারাংশ</b><div id="sumLines"></div></div>
    <label>প্রাপকের নাম<input name="r" required maxlength="60" autocomplete="name"></label>
    <label>মোবাইল নম্বর<input name="ph" type="tel" inputmode="tel" required placeholder="01XXXXXXXXX" autocomplete="tel"></label>
    <label>বিভাগ<select name="dv" required id="dvSel"></select></label>
    <label>জেলা<input name="ds" required maxlength="40"></label>
    <label>উপজেলা / থানা<input name="up" required maxlength="40"></label>
    <label>বিস্তারিত ঠিকানা (বাড়ি, রাস্তা, এলাকা)<input name="ln" required maxlength="160" autocomplete="street-address"></label>
    <fieldset><legend>পেমেন্ট পদ্ধতি</legend>
      <label class="rad"><input type="radio" name="pm" value="cod" checked> <span>ক্যাশ অন ডেলিভারি<br><span class="mu">পণ্য হাতে পেয়ে টাকা দিন</span></span></label>
      <label class="rad"><input type="radio" name="pm" value="bkash"> <span>বিকাশ<br><span class="mu">সেন্ড মানি করে ট্রানজেকশন আইডি দিন</span></span></label>
      <label class="rad"><input type="radio" name="pm" value="nagad"> <span>নগদ<br><span class="mu">সেন্ড মানি করে ট্রানজেকশন আইডি দিন</span></span></label>
    </fieldset>
    <div class="pay" id="payBox" hidden>
      <div>এই নম্বরে <b id="payAmt"></b> সেন্ড মানি করুন: <span class="num" id="payNum"></span></div>
      <label>যে নম্বর থেকে পাঠিয়েছেন<input name="pf" type="tel" inputmode="tel" placeholder="01XXXXXXXXX"></label>
      <label>ট্রানজেকশন আইডি (TrxID)<input name="tx" maxlength="20" autocapitalize="characters" placeholder="যেমন: 8N7A6D5EF4"></label>
      <span class="mu">টাকা পৌঁছানো যাচাই করে আপনার অর্ডার নিশ্চিত করা হবে।</span>
    </div>
    <div class="err" id="chkErr" role="alert"></div>
    <div class="row" style="margin:0"><span>মোট পণ্যমূল্য</span><b id="chkTot" style="font-size:1.3rem"></b></div>
    <button class="btn" type="submit">অর্ডার নিশ্চিত করুন</button>
    <button class="btn ghost" type="button" id="backCart">← কার্টে ফিরুন</button>
  </form>
</aside>
<div id="toast" role="status"></div>

<script>
var CATS=["সব","ইলেকট্রনিক্স","ফ্যাশন","মুদি ও খাদ্য","গৃহসামগ্রী","বই ও স্টেশনারি","স্বাস্থ্য ও সৌন্দর্য","খেলনা","যানবাহন"];
var SEED=[
{n:"স্মার্টফোন (৬/১২৮ জিবি)",c:"ইলেকট্রনিক্স",p:18500,s:"টেক জোন",e:"📱",cl:[{n:"কালো",h:"#222222"},{n:"নীল",h:"#1f4fd8"},{n:"সাদা",h:"#ffffff"}],k:12,d:"৬.৭ ইঞ্চি ডিসপ্লে, ৫০০০ mAh ব্যাটারি, ১ বছরের ওয়ারেন্টি।"},

   '<p>অর্ডার নম্বর <b>#'+bn(o.no)+'</b> · মোট <b>'+tk(o.total)+'</b></p>'+
   '<p>'+esc(o.addr.r)+', '+esc(o.addr.ph)+'<br>'+esc(o.addr.ln)+', '+esc(o.addr.up)+', '+esc(o.addr.ds)+', '+esc(o.addr.dv)+'</p>'+
   '<p>পেমেন্ট: <b>'+payName(o.pay)+'</b></p>'+(o.pay==="cod"?'<p class="mu">পণ্য হাতে পেয়ে টাকা দিন।</p>':mobile)+
   '<button class="btn" data-v="shop">আরও কেনাকাটা করুন</button> <button class="btn ghost" data-v="dash">আমার অর্ডার দেখুন</button></div>';
}
function payName(k){return k==="cod"?"ক্যাশ অন ডেলিভারি":k==="bkash"?"বিকাশ":k==="nagad"?"নগদ":"—"}
var ST_BN={pending:"অপেক্ষমাণ",verify:"পেমেন্ট যাচাই বাকি",confirmed:"নিশ্চিত",shipped:"পথে আছে",delivered:"পৌঁছেছে",cancelled:"বাতিল"};
function sell(){
  return '<div class="panel"><h2 style="margin-top:0">আপনার পণ্য বিক্রির জন্য তুলুন</h2><form id="sf">'+
  '<label>পণ্যের নাম<input name="n" required maxlength="60"></label>'+
  '<label>ক্যাটাগরি<select name="c">'+CATS.slice(1).map(function(c){return '<option>'+c+'</option>'}).join("")+'</select></label>'+
  '<label>দাম (টাকা)<input name="p" type="number" min="1" required></label>'+
  '<label>বিক্রেতার নাম / দোকান<input name="s" required maxlength="40"></label>'+
  '<label>ইমোজি আইকন (ঐচ্ছিক)<input name="e" maxlength="4" placeholder="🛍️"></label>'+
  '<label>স্টকে কতটি আছে<input name="k" type="number" min="1" max="9999" value="10" required></label>'+
  '<label>বিবরণ (ঐচ্ছিক)<input name="d" maxlength="300"></label>'+
  '<label>রং (ঐচ্ছিক, কমা দিয়ে লিখুন — যেমন: কালো, নীল, লাল)<input name="cl" maxlength="80"></label>'+
  '<label>সাইজ (ঐচ্ছিক, কমা দিয়ে লিখুন — যেমন: M, L, XL)<input name="sz" maxlength="60"></label>'+
  '<button class="btn" type="submit">পণ্য প্রকাশ করুন</button></form></div>';
}
function bindSell(){
  $("#sf").addEventListener("submit",function(ev){
    ev.preventDefault();var f=new FormData(ev.target);
    var HEX={"কালো":"#222222","সাদা":"#ffffff","নীল":"#1f4fd8","লাল":"#d62828","সবুজ":"#2a9d55","ধূসর":"#8d99ae","বাদামি":"#7b4a2b","হলুদ":"#f2c230","গোলাপি":"#ec6fa5","মেরুন":"#7a1f2b","সোনালি":"#d4a017","কমলা":"#f28c28","বেগুনি":"#7b3fb0"};
    var list=function(v){return String(v||"").split(/[,،]/).map(function(x){return x.trim()}).filter(Boolean).slice(0,10)};
    var cl=list(f.get("cl")).map(function(n){return{n:n,h:HEX[n]||"#b0b7b3"}}),sz=list(f.get("sz"));
    var np={id:Date.now(),n:f.get("n"),c:f.get("c"),p:+f.get("p"),s:f.get("s"),e:f.get("e")||"🛍️",k:Math.max(1,+f.get("k")||1),d:f.get("d")||"",u:1};
    if(cl.length)np.cl=cl;if(sz.length)np.sz=sz;
    st.products.unshift(np);
    save();toast("পণ্য প্রকাশিত হয়েছে");st.view="shop";st.cat="সব";render();
  });
}
function dash(){
  var o=st.orders,t=total(),by={};
  o.forEach(function(x){x.lines.forEach(function(l){by[l.c]=(by[l.c]||0)+l.p*l.q})});
  var keys=Object.keys(by).sort(function(a,b){return by[b]-by[a]}),mx=keys.length?by[keys[0]]:1;
  var avg=o.length?Math.round(t/o.length):0,units=o.reduce(function(a,x){return a+x.lines.reduce(function(s,l){return s+l.q},0)},0);
  return '<h2 style="margin:0 0 12px">বিক্রয় ও ক্রয়ের ড্যাশবোর্ড</h2>'+
  '<div class="stats"><div class="stat big"><span class="mu">মোট ক্রয়ের পরিমাণ</span><b>'+tk(t)+'</b></div>'+
  '<div class="stat"><span class="mu">মোট অর্ডার</span><b>'+bn(o.length)+'</b></div>'+
  '<div class="stat"><span class="mu">গড় অর্ডার মূল্য</span><b>'+tk(avg)+'</b></div>'+
  '<div class="stat"><span class="mu">বিক্রিত পণ্য / তালিকাভুক্ত</span><b>'+bn(units)+' / '+bn(st.products.length)+'</b></div></div>'+
  '<div class="two"><div class="panel"><b>ক্যাটাগরি অনুযায়ী ক্রয়</b><div class="bars">'+
  (keys.length?keys.map(function(k){return '<div class="l"><span>'+esc(k)+'</span><b>'+tk(by[k])+'</b></div><div class="t"><span style="width:'+Math.round(by[k]/mx*100)+'%"></span></div>'}).join(""):'<div class="empty">এখনও কোনো ক্রয় হয়নি। বাজার থেকে প্রথম অর্ডারটি দিন।</div>')+
  '</div></div><div class="panel"><b>সাম্প্রতিক অর্ডার</b><div class="tbl">'+
  (o.length?'<table><tr><th>অর্ডার</th><th>সময়</th><th>পণ্য</th><th>ঠিকানা</th><th>পেমেন্ট</th><th>মোট</th></tr>'+o.slice(0,8).map(function(x){return '<tr><td>#'+bn(x.no)+'</td><td>'+esc(x.at)+'</td><td>'+bn(x.lines.length)+'টি</td><td>'+(x.addr?esc(x.addr.ds)+', '+esc(x.addr.up):'—')+'</td><td>'+payName(x.pay)+'<br><span class="badge'+(x.status==='verify'?' warn':'')+'">'+(ST_BN[x.status]||'অপেক্ষমাণ')+'</span></td><td><b>'+tk(x.total)+'</b></td></tr>'}).join("")+'</table>':'<div class="empty">কোনো অর্ডার নেই।</div>')+
  '</div></div></div>';
}
function cartUI(){
  var ks=Object.keys(st.cart),n=0,sum=0;
  var h=ks.map(function(k){var v=byKey(k),p=v.p;if(!p)return"";var q=st.cart[k];n+=q;sum+=p.p*q;
    var meta=[v.c,v.z].filter(Boolean).map(esc).join(" · ");
    var dot=v.c?'<i style="display:inline-block;width:12px;height:12px;border-radius:50%;background:'+colHex(p,v.c)+';border:1px solid rgba(0,0,0,.3);margin-right:5px"></i>':'';
    return '<div class="it"><span class="e">'+esc(p.e)+'</span><div class="n"><div>'+esc(p.n)+'</div>'+(meta?'<span class="mu">'+dot+meta+'</span><br>':'')+'<span class="mu">'+tk(p.p)+'</span></div><div class="q"><button data-dec="'+esc(k)+'" aria-label="কমান">−</button> '+bn(q)+' <button data-inc="'+esc(k)+'" aria-label="বাড়ান">+</button></div></div>'}).join("");
  $("#items").innerHTML=h||'<div class="empty">কার্ট খালি। পছন্দের পণ্য যোগ করুন।</div>';
  $("#cc").textContent=bn(n);$("#cc").hidden=!n;$("#ct").textContent=tk(sum);$("#buy").disabled=!n;
}
var DIVS=["ঢাকা","চট্টগ্রাম","রাজশাহী","খুলনা","বরিশাল","সিলেট","রংপুর","ময়মনসিংহ"];
$("#dvSel").innerHTML='<option value="">বাছাই করুন</option>'+DIVS.map(function(d){return '<option>'+d+'</option>'}).join("");
function normDigits(x){return String(x).replace(/[০-৯]/g,function(d){return "০১২৩৪৫৬৭৮৯".indexOf(d)})}
function payUI(){
  var f=$("#chkForm"),m=f.elements.pm.value,box=$("#payBox");
  box.hidden=m==="cod";
  if(m!=="cod"){$("#payNum").textContent=PAY[m];$("#payAmt").textContent=tk(cartLines().sum)}
}
document.addEventListener("change",function(e){if(e.target.name==="pm")payUI()});
function setStep(k){var c=k==="chk";$("#items").hidden=c;$("#cartFt").hidden=c;$("#chkForm").hidden=!c;$("#dt").textContent=c?"ডেলিভারির ঠিকানা":"আপনার কার্ট";if(!c)$("#chkErr").textContent=""}
function cartLines(){var l=[],sum=0;Object.keys(st.cart).forEach(function(k){var v=byKey(k),p=v.p;if(p){l.push({id:p.id,n:p.n,c:p.c,p:p.p,q:st.cart[k],col:v.c||"",sz:v.z||""});sum+=p.p*st.cart[k]}});return{lines:l,sum:sum}}
function startCheckout(){
  var c=cartLines(),f=$("#chkForm");
  $("#sumLines").innerHTML=c.lines.map(function(x){return '<div class="row" style="margin:0;padding:2px 0"><span>'+esc(x.n)+(x.col||x.sz?' ('+[x.col,x.sz].filter(Boolean).map(esc).join(", ")+')':'')+' × '+bn(x.q)+'</span><span>'+tk(x.p*x.q)+'</span></div>'}).join("");
  $("#chkTot").textContent=tk(c.sum);
  var a=st.addr||{};
  [["r","r"],["ph","ph"],["dv","dv"],["ds","ds"],["up","up"],["ln","ln"]].forEach(function(k){if(a[k[1]]&&!f.elements[k[0]].value)f.elements[k[0]].value=a[k[1]]});
  setStep("chk");payUI();f.elements.r.focus();
}
document.addEventListener("submit",function(e){
  if(e.target.id!=="chkForm")return;e.preventDefault();
  var f=new FormData(e.target),err=$("#chkErr"),g=function(k){return String(f.get(k)||"").trim()};
  var ph=normDigits(g("ph")).replace(/[\s-]/g,"");if(/^8801/.test(ph))ph="+"+ph;
  var addr={r:g("r"),ph:ph,dv:g("dv"),ds:g("ds"),up:g("up"),ln:g("ln")};
  if(!addr.r||!addr.dv||!addr.ds||!addr.up||!addr.ln){err.textContent="সব ঘর পূরণ করুন।";return}
  if(!/^(\+8801|01)[3-9][0-9]{8}$/.test(ph)){err.textContent="সঠিক মোবাইল নম্বর দিন (যেমন: 01712345678)।";e.target.elements.ph.focus();return}
  var c=cartLines();if(!c.lines.length){err.textContent="কার্ট খালি।";return}
  var pm=g("pm")||"cod",pf="",tx="";
  if(pm!=="cod"){
    pf=normDigits(g("pf")).replace(/[\s-]/g,"");if(/^8801/.test(pf))pf="+"+pf;tx=g("tx").toUpperCase();
    if(PAY[pm].indexOf("X")>-1){err.textContent="এই পেমেন্ট পদ্ধতি এখনো চালু হয়নি। অনুগ্রহ করে ক্যাশ অন ডেলিভারি বাছুন।";return}
    if(!/^(\+8801|01)[3-9][0-9]{8}$/.test(pf)){err.textContent="যে নম্বর থেকে টাকা পাঠিয়েছেন সেটি সঠিকভাবে দিন।";e.target.elements.pf.focus();return}
    if(!/^[A-Z0-9]{8,12}$/.test(tx)){err.textContent="ট্রানজেকশন আইডি ৮–১২ অক্ষরের হতে হবে (ইংরেজি অক্ষর ও সংখ্যা)।";e.target.elements.tx.focus();return}
    if(st.orders.some(function(o){return o.tx===tx})){err.textContent="এই ট্রানজেকশন আইডি দিয়ে আগেই অর্ডার করা হয়েছে।";return}
  }
  for(var i=0;i<c.lines.length;i++){var ln=c.lines[i],pp=st.products.find(function(x){return x.id==ln.id});
    var tot=c.lines.filter(function(x){return x.id===ln.id}).reduce(function(a,x){return a+x.q},0);
    if(pp&&tot>left(pp)){err.textContent="“"+pp.n+"” এর স্টকে মাত্র "+bn(left(pp))+"টি আছে। কার্ট ঠিক করুন।";return}}
  c.lines.forEach(function(x){st.sold[x.id]=(st.sold[x.id]||0)+x.q});
  st.addr=addr;
  st.orders.unshift({no:st.orders.length+1,at:new Date().toLocaleString("bn-BD",{dateStyle:"short",timeStyle:"short"}),lines:c.lines,total:c.sum,addr:addr,pay:pm,paid:false,status:pm==="cod"?"pending":"verify",pf:pf,tx:tx});
  st.cart={};save();cartUI();closeCart(true);st.view="done";render();window.scrollTo(0,0);
});
var lastFocus=null;
function openCart(){var d=$("#drawer");lastFocus=document.activeElement;d.inert=false;d.removeAttribute("inert");d.setAttribute("aria-hidden","false");d.classList.add("open");$("#closeCart").focus()}
function closeCart(skipFocus){setStep("cart");var d=$("#drawer");d.classList.remove("open");d.inert=true;d.setAttribute("aria-hidden","true");if(!skipFocus&&lastFocus)lastFocus.focus()}
document.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.open&&e.target.tagName!=="BUTTON"){e.preventDefault();e.target.click();return}
  if(e.key==="Escape"&&$("#drawer").classList.contains("open"))closeCart()});
document.addEventListener("click",function(e){
  var t=e.target.closest("button,[data-open]");if(!t)return;
  if(t.dataset.v){st.view=t.dataset.v;render();window.scrollTo(0,0)}
  else if(t.dataset.cat){st.cat=t.dataset.cat;render()}
  else if(t.dataset.role){st.role=t.dataset.role;st.view=st.role==="seller"?"sdash":"shop";save();render();window.scrollTo(0,0)}
  else if(t.dataset.go){if(st.view!=="shop"){st.view="shop";render()}var el=document.getElementById(t.dataset.go);if(!el){st.cat="সব";st.qs="";$("#q").value="";render();el=document.getElementById(t.dataset.go)}if(el)el.scrollIntoView({behavior:"smooth"})}
  else if(t.dataset.st){var sa=t.dataset.st.split("|"),od=st.orders.find(function(o){return o.no==sa[0]});if(od){od.status=sa[1];if(sa[1]==="delivered"||(sa[1]==="confirmed"&&od.pay!=="cod"))od.paid=true;save();render();toast("অর্ডারের অবস্থা বদলানো হয়েছে")}}
  else if(t.dataset.del){var dp=st.products.find(function(x){return x.id==t.dataset.del});if(dp&&dp.u&&confirm("পণ্যটি মুছবেন?")){st.products=st.products.filter(function(x){return x!==dp});save();render()}}
  else if(t.id==="bell")toast("নতুন কোনো নোটিফিকেশন নেই")
  else if(t.id==="flt"){var so=["new","asc","desc"],nm={"new":"নতুন আগে",asc:"কম দাম আগে",desc:"বেশি দাম আগে"};st.sort=so[(so.indexOf(st.sort)+1)%3];st.view="shop";render();toast("সাজানো: "+nm[st.sort])}
  else if(t.dataset.add){
    var pa=st.products.find(function(x){return x.id==t.dataset.add});if(!pa)return;
    if((pa.cl&&pa.cl.length)||(pa.sz&&pa.sz.length)){st.pid=pa.id;st.sel={c:null,z:null,q:1};st.view="item";render();window.scrollTo(0,0);toast("রং/সাইজ বেছে কার্টে দিন")}
    else if(inCart(pa)>=left(pa)){toast("এর বেশি স্টকে নেই")}
    else{var k0=ck(pa.id,"","");st.cart[k0]=(st.cart[k0]||0)+1;save();cartUI();toast("কার্টে যোগ হয়েছে")}
  }
  else if(t.dataset.open){st.pid=+t.dataset.open;st.sel={c:null,z:null,q:1};st.view="item";render();window.scrollTo(0,0)}
  else if(t.dataset.color){st.sel.c=t.dataset.color;render()}
  else if(t.dataset.size){st.sel.z=t.dataset.size;render()}
  else if(t.dataset.q){var pr=st.products.find(function(x){return x.id==st.pid}),mxq=Math.max(1,left(pr)-inCart(pr));st.sel.q=Math.min(mxq,Math.max(1,st.sel.q+ +t.dataset.q));$("#qv").textContent=bn(st.sel.q)}
  else if(t.dataset.addv){
    var pr2=st.products.find(function(x){return x.id==st.pid}),er=$("#itemErr");
    if(pr2.cl&&pr2.cl.length&&!st.sel.c){er.textContent="আগে একটি রং বাছুন।";return}
    if(pr2.sz&&pr2.sz.length&&!st.sel.z){er.textContent="আগে সাইজ বাছুন।";return}
    if(left(pr2)-inCart(pr2)<st.sel.q){er.textContent="দুঃখিত, এর বেশি স্টকে নেই।";return}
    var key=ck(pr2.id,st.sel.c,st.sel.z);st.cart[key]=(st.cart[key]||0)+st.sel.q;save();cartUI();
    if(t.dataset.addv==="buy"){openCart();startCheckout()}else{toast("কার্টে যোগ হয়েছে");st.sel.q=1;render()}
  }
  else if(t.dataset.inc){var iv=byKey(t.dataset.inc);if(iv.p&&inCart(iv.p)<left(iv.p)){st.cart[t.dataset.inc]++;save();cartUI()}else toast("এর বেশি স্টকে নেই")}
  else if(t.dataset.dec){if(--st.cart[t.dataset.dec]<1)delete st.cart[t.dataset.dec];save();cartUI()}
  else if(t.id==="cartBtn")openCart();
  else if(t.id==="closeCart")closeCart();
  else if(t.id==="buy"){if(Object.keys(st.cart).length)startCheckout()}
  else if(t.id==="backCart")setStep("cart");
});
$("#q").addEventListener("input",function(e){st.qs=e.target.value;if(st.view!=="shop")st.view="shop";render()});
document.addEventListener("scroll",function(e){var b=e.target;if(b.classList&&b.classList.contains("bnr")){var i=Math.round(b.scrollLeft/b.clientWidth);document.querySelectorAll(".dots i").forEach(function(d,k){d.classList.toggle("on",k===i)})}},true);
if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches)setInterval(function(){var b=document.querySelector(".bnr");if(!b||st.view!=="shop"||document.hidden)return;b.scrollTo({left:((Math.round(b.scrollLeft/b.clientWidth)+1)%3)*b.clientWidth,behavior:"smooth"})},4500);
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
