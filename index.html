<html lang="bn">

<title>বাজারবন্ধু – কিনুন সহজে, বিক্রি করুন নিশ্চিন্তে!</title>
<meta name="description" content="কিনুন সহজে, বিক্রি করুন নিশ্চিন্তে! নতুন-পুরাতন সব পণ্যের কেনাবেচা হোক এক জায়গায়।">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8f3;--sf:#fff;--tx:#162318;--mu:#6a7b6e;--ln:#e1eadf;--g:#1c8f2e;--g2:#0f6b1d;--o:#f57c1a;--wash:#e8f5e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1711;--sf:#17221a;--tx:#e8f1ea;--mu:#9bb0a0;--ln:#273a2c;--wash:#1d3022;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.45}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
#app{max-width:480px;margin:auto;min-height:100vh;padding:0 14px 110px;position:relative}
.hd{position:relative;padding:14px 0 6px;display:flex;align-items:center;gap:10px}
.hd::before{content:"";position:absolute;left:-14px;top:-40px;width:70%;height:70px;background:var(--g);border-radius:0 0 80% 0;z-index:-1}
.logo{display:flex;align-items:center;gap:8px;flex:1}
.lm{width:44px;height:44px;border-radius:14px;background:var(--g);color:#fff;font-weight:700;font-size:1.6rem;display:grid;place-items:center;box-shadow:0 3px 8px rgba(28,143,46,.35);border-bottom:4px solid var(--o)}
.lt b{font-size:1.5rem;line-height:1;color:var(--g2)}.lt b span{color:var(--o)}.lt small{display:block;color:var(--mu);font-size:.68rem;line-height:1.25}.sl p.sub{margin:0 0 10px;font-size:.85rem}.kd{position:absolute;left:8px;top:8px;background:var(--g);color:#fff;font-size:.7rem;padding:1px 8px;border-radius:99px;z-index:1}.kd.old{background:var(--o)}
.ic{width:44px;height:44px;border-radius:50%;background:var(--sf);position:relative;font-size:1.3rem;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.bdg{position:absolute;top:-3px;right:-3px;background:#e53935;color:#fff;font-size:.7rem;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-weight:600}
.role{display:flex;background:var(--wash);border-radius:99px;padding:4px;margin:8px 0 12px}
.role button{flex:1;padding:8px;border-radius:99px;font-weight:600;color:var(--mu)}
.role button.on{background:var(--g);color:#fff;box-shadow:0 2px 6px rgba(28,143,46,.4)}
.sr{display:flex;gap:10px;margin-bottom:14px}
.sr div{flex:1;display:flex;align-items:center;gap:8px;background:var(--sf);border-radius:99px;padding:0 16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.sr input{flex:1;border:0;background:none;padding:12px 0;outline:0;min-width:0}
.flt{width:50px;border-radius:16px;background:var(--g);color:#fff;font-size:1.2rem}
#bn{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;border-radius:20px;scrollbar-width:none;box-shadow:0 4px 14px rgba(0,0,0,.12)}
#bn::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:center;padding:18px;display:flex;align-items:center;justify-content:space-between;min-height:150px}
.sl h3{margin:0 0 8px;font-size:1.1rem;line-height:1.3}.sl .big{font-size:3.6rem}
.sl button{background:var(--o);color:#fff;border-radius:99px;padding:7px 16px;font-weight:600;box-shadow:0 3px 8px rgba(245,124,26,.4)}
.s1{background:linear-gradient(120deg,#f0fbd8,#c9eebd);color:#0f4d17}.s2{background:linear-gradient(120deg,#fff3c4,#ffd978);color:#5a3500}.s3{background:linear-gradient(120deg,#d6f1ff,#a9dcf5);color:#0b3d57}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 14px}.dots i{width:28px;height:7px;border-radius:4px;background:var(--ln)}.dots i.on{background:var(--g)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.cat{background:var(--sf);border-radius:16px;padding:10px 2px 8px;text-align:center;font-size:.78rem;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.cat span{display:block;font-size:1.9rem}
h2.sec{display:flex;justify-content:space-between;align-items:center;font-size:1.2rem;margin:6px 0 10px}
h2.sec button{color:var(--g);font-size:.9rem;font-weight:600}
.hs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}.hs .pc{flex:0 0 150px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{background:var(--sf);border-radius:16px;padding:10px;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.pic{font-size:3.6rem;text-align:center;padding:10px 0;background:var(--wash);border-radius:12px}
.nm{font-weight:600;margin-top:6px;font-size:.95rem}.pr{font-weight:700}.rt{color:var(--mu);font-size:.8rem}.rt::first-letter{color:#f5a300}
.cb{position:absolute;right:8px;bottom:8px;width:36px;height:36px;border-radius:50%;background:var(--g);color:#fff}
.hrt{position:absolute;right:8px;top:8px;font-size:1.1rem}
.offer{background:linear-gradient(110deg,#ffe066,#ffc928);border-radius:18px;padding:16px;display:flex;align-items:center;gap:12px;color:#5a2200;margin:4px 0 16px}
.offer .gift{font-size:3.2rem}.offer b{color:#c62828;font-size:1.2rem}.off{margin-left:auto;background:#d32f2f;color:#fff;border-radius:50%;width:72px;height:72px;display:grid;place-items:center;text-align:center;font-weight:700;line-height:1.1;font-size:1.3rem}.off small{font-size:.6rem}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--sf);border-radius:22px 22px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.1);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:.76rem;color:var(--mu);position:relative;padding:2px 0}
nav button span{font-size:1.4rem;line-height:1.3}nav button.on{color:var(--g);font-weight:600}nav button.on::after{content:"";position:absolute;bottom:-4px;width:36px;height:3px;border-radius:2px;background:var(--g)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chip{white-space:nowrap;background:var(--sf);padding:6px 14px;border-radius:99px;box-shadow:0 1px 4px rgba(0,0,0,.1)}.chip.on{background:var(--g);color:#fff}
.box{background:var(--sf);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.07);margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--sf);border-radius:16px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.07)}.stat small{color:var(--mu)}.stat b{display:block;font-size:1.4rem}
.stat.big{grid-column:1/-1;background:linear-gradient(120deg,var(--g),var(--g2));color:#fff}.stat.big small{color:#d3f0d6}.stat.big b{font-size:2rem}
.btn{background:var(--g);color:#fff;border-radius:12px;padding:11px 16px;font-weight:600;width:100%}.btn.o{background:var(--o)}.btn:disabled{opacity:.5}
.it{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.it:last-child{border:0}.it .e{font-size:2rem}.it .n{flex:1}
.q button{width:28px;height:28px;border-radius:8px;background:var(--wash);font-weight:700}
.bar{height:8px;background:var(--wash);border-radius:5px;margin:3px 0 10px}.bar i{display:block;height:100%;background:var(--o);border-radius:5px}
form{display:grid;gap:10px}label{display:grid;gap:4px;font-weight:500}input,select{padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg)}
.mu{color:var(--mu);font-size:.88rem}.empty{text-align:center;color:var(--mu);padding:28px 10px}.del{color:#d32f2f;font-weight:600}
.av{width:64px;height:64px;border-radius:50%;background:var(--wash);display:grid;place-items:center;font-size:2.2rem}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;white-space:nowrap}#toast.show{opacity:1}
.pic{display:grid;place-items:center;height:96px;overflow:hidden}.pic svg{width:74px;height:74px}.pic img{width:100%;height:96px;object-fit:contain;background:#fff}
.it .e{width:44px;height:44px;flex:none}.it .e svg,.it .e img{width:44px;height:44px;border-radius:8px;object-fit:contain;background:#fff}
.cat svg{width:40px;height:40px}.cat span{margin-bottom:2px}
.pc{background:#fff;color:#162318}.pic{background:#fff!important;height:104px}.pic img{height:104px}.pic svg{width:78px;height:78px}.pc .pr,.pc .nm{color:#162318}
.hs .pc{flex:0 0 31%;min-width:108px}.hs .nm{font-size:.82rem}.hs .pr{font-size:.95rem}.hs .cb{width:32px;height:32px}
.cat{background:linear-gradient(#fff,#eef3fa)!important;color:#162318;border-radius:18px}.cat span{height:50px;display:grid;place-items:center}.cat img{width:48px;height:48px;object-fit:contain}.cat svg{width:42px;height:42px}
.lg{width:64px;height:48px;object-fit:contain}.ic{overflow:hidden;padding:0}.ic .avi{width:44px;height:44px;border-radius:50%;object-fit:cover;display:block}.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.sl{position:relative;overflow:hidden}.sl>div:first-child{position:relative;z-index:1;max-width:58%}.s1{background:linear-gradient(120deg,#f4fbd9,#fff)}
.bimg{position:absolute;right:0;top:0;bottom:0;width:54%}.bimg img{width:100%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(to right,transparent,#000 35%);mask-image:linear-gradient(to right,transparent,#000 35%)}
.offer .gift img{width:86px;height:86px;object-fit:cover;border-radius:16px;display:block}
</style>
</head>

  return `<div class="hd"><div class="logo"><img class="lg" alt="" src="data:image/webp;base64,${IMG.logo}"><div class="lt"><b>বাজার<span>বন্ধু</span></b><small>কিনুন সহজে, বিক্রি করুন নিশ্চিন্তে!</small></div></div>
  <button class="ic" data-a="bell" aria-label="নোটিফিকেশন">🔔${S.orders.length?`<span class="bdg">${S.orders.length>9?"9+":S.orders.length}</span>`:""}</button>
  <button class="ic" data-a="tab" data-t="${S.role==="buyer"?"profile":"sdash"}" aria-label="প্রোফাইল"><img class="avi" alt="" src="data:image/webp;base64,${IMG.avatar}"></button></div>
  <div class="role"><button data-a="role" data-r="buyer" class="${S.role==="buyer"?"on":""}">🛍️ ক্রেতা</button><button data-a="role" data-r="seller" class="${S.role==="seller"?"on":""}">🏪 বিক্রেতা</button></div>`;
}
function home(){
  const q=S.q.trim().toLowerCase();
  let h=`<div class="sr"><div><span>🔍</span><input id="q" value="${esc(S.q)}" placeholder="কি খুঁজছেন?" aria-label="খুঁজুন"></div><button class="flt" data-a="tab" data-t="cat" aria-label="ফিল্টার">⚙️</button></div>`;
  if(q)return h+`<h2 class="sec">খোঁজার ফলাফল</h2>`+grid(S.products.filter(p=>(p.n+p.c).toLowerCase().includes(q)));
  h+=`<div id="bn"><div class="sl s1"><div><h3>কিনুন সহজে, বিক্রি করুন নিশ্চিন্তে! ❤️</h3><p class="sub">নতুন-পুরাতন সব পণ্যের কেনাবেচা হোক এক জায়গায়।</p><button data-a="tab" data-t="cat">এখনই কিনুন →</button></div><div class="bimg"><img alt="" src="data:image/webp;base64,${IMG.cart}"></div></div>
  <div class="sl s2"><div><h3>বিক্রি করুন,<br>আয় বাড়ান</h3><button data-a="role" data-r="seller">বিক্রেতা হোন →</button></div><div class="big">🏪</div></div>
  <div class="sl s3"><div><h3>সেরা পণ্যে<br>বড় ছাড়!</h3><button data-a="tab" data-t="cat">অফার দেখুন →</button></div><div class="big">🎁</div></div></div>
  <div class="dots"><i class="on"></i><i></i><i></i></div><div class="cats">`+
  CATS.map(c=>`<button class="cat" data-a="cat" data-c="${c[0]}"><span>${ICON[c[1]]}</span>${c[0]}</button>`).join("")+
  `<button class="cat" data-a="tab" data-t="cat"><span>${ICON.more}</span>আরও দেখুন ›</button></div>
  <h2 class="sec"><span>🔥 জনপ্রিয় পণ্য</span><button data-a="tab" data-t="cat">আরও দেখুন ›</button></h2>
  <div class="hs">${S.products.slice().sort((a,b)=>a.id-b.id).slice(0,6).map(card).join("")}</div>
  <div class="offer"><div class="gift"><img alt="" src="data:image/webp;base64,${IMG.giftbig}"></div><div><b>স্পেশাল অফার!</b><br>সেরা পণ্যে পাচ্ছেন বড় ছাড়!</div><div class="off"><span><small>UP TO</small><br>70%<br><small>OFF</small></span></div></div>
  <h2 class="sec">সব পণ্য</h2>`+grid(S.products)+'<div class="box" style="text-align:center"><b style="color:var(--g);font-size:1.2rem">বাজারবন্ধু</b><div class="mu">কিনুন সহজে, বিক্রি করুন নিশ্চিন্তে!<br>নতুন-পুরাতন সব পণ্যের কেনাবেচা হোক এক জায়গায়।</div></div>';
  return h;
}
function catTab(){
  return `<h2 class="sec">ক্যাটাগরি</h2><div class="chips"><button class="chip ${!S.cat?"on":""}" data-a="cat" data-c="">সব</button>`+
  CATS.map(c=>`<button class="chip ${S.cat===c[0]?"on":""}" data-a="cat" data-c="${c[0]}">${c[0]}</button>`).join("")+`</div>`+
  grid(S.products.filter(p=>!S.cat||p.c===S.cat));
}
function cartTab(){
  const ids=Object.keys(S.cart);let sum=0;
  const rows=ids.map(id=>{const p=find(id);if(!p)return"";sum+=p.p*S.cart[id];
    return `<div class="it"><span class="e">${ico(p)}</span><div class="n">${esc(p.n)}<div class="mu">${fmt(p.p)}</div></div><div class="q"><button data-a="dec" data-id="${id}" aria-label="কমান">−</button> ${S.cart[id]} <button data-a="inc" data-id="${id}" aria-label="বাড়ান">+</button></div></div>`}).join("");
  return `<h2 class="sec">আমার কার্ট</h2>`+(ids.length?`<div class="box">${rows}<div class="it"><div class="n"><b>মোট</b></div><b style="font-size:1.3rem">${fmt(sum)}</b></div></div><button class="btn o" data-a="buy">অর্ডার নিশ্চিত করুন</button>`:'<div class="empty">কার্ট খালি। পছন্দের পণ্য যোগ করুন।</div>');
}
function favTab(){return `<h2 class="sec">❤️ আমার পছন্দ</h2>`+(S.favs.length?grid(S.products.filter(p=>S.favs.includes(p.id))):'<div class="empty">পছন্দের তালিকা খালি</div>')}
function orderList(o){
  return o.length?o.slice(0,20).map(x=>`<div class="box"><div style="display:flex;justify-content:space-between"><b>অর্ডার #${x.no}</b><b>${fmt(x.total)}</b></div><div class="mu">${esc(x.at)}</div>${x.lines.map(l=>`<div class="mu">${esc(l.n)} × ${l.q} = ${fmt(l.p*l.q)}</div>`).join("")}</div>`).join(""):'<div class="empty">কোনো অর্ডার নেই</div>';
}
function profile(){
  const n=S.orders.length;
  return `<div class="box" style="display:flex;gap:14px;align-items:center"><div class="av"><img alt="" src="data:image/webp;base64,${IMG.avatar}"></div><div><b style="font-size:1.2rem">আমার প্রোফাইল</b><div class="mu">ক্রেতা অ্যাকাউন্ট</div></div></div>
  <div class="stats"><div class="stat big"><small>মোট ক্রয়ের পরিমাণ</small><b>${fmt(total())}</b></div><div class="stat"><small>মোট অর্ডার</small><b>${n}</b></div><div class="stat"><small>গড় অর্ডার</small><b>${fmt(n?Math.round(total()/n):0)}</b></div></div>
  <button class="btn" data-a="role" data-r="seller" style="margin-bottom:14px">🏪 বিক্রেতা মোডে যান</button><h2 class="sec">ক্রয়ের ইতিহাস</h2>`+orderList(S.orders);
}
function sdash(){
  const mine=new Set(S.products.filter(p=>p.s===SHOP).map(p=>p.id)),by={};let sales=0,units=0;
  S.orders.forEach(o=>o.lines.forEach(l=>{if(mine.has(l.id)){sales+=l.p*l.q;units+=l.q;by[l.n]=(by[l.n]||0)+l.p*l.q}}));
  const k=Object.keys(by).sort((a,b)=>by[b]-by[a]).slice(0,5),mx=k.length?by[k[0]]:1;
  return `<div class="box" style="display:flex;gap:14px;align-items:center"><div class="av">🏪</div><div><b style="font-size:1.2rem">${SHOP}</b><div class="mu">বিক্রেতা ড্যাশবোর্ড</div></div></div>
  <div class="stats"><div class="stat big"><small>মোট বিক্রয়</small><b>${fmt(sales)}</b></div><div class="stat"><small>বিক্রিত পণ্য</small><b>${units}</b></div><div class="stat"><small>তালিকায় পণ্য</small><b>${mine.size}</b></div></div>
  <div class="box"><b>সেরা বিক্রিত পণ্য</b>${k.length?k.map(n=>`<div style="display:flex;justify-content:space-between;margin-top:8px"><span>${esc(n)}</span><b>${fmt(by[n])}</b></div><div class="bar"><i style="width:${Math.round(by[n]/mx*100)}%"></i></div>`).join(""):'<div class="empty">এখনও কোনো বিক্রি হয়নি</div>'}</div>
  <button class="btn o" data-a="tab" data-t="sadd">➕ নতুন পণ্য যোগ করুন</button>`;
}
function sprod(){
  const l=S.products.filter(p=>p.s===SHOP);
  return `<h2 class="sec">আমার পণ্য (${l.length})</h2><div class="box">`+(l.length?l.map(p=>`<div class="it"><span class="e">${ico(p)}</span><div class="n">${esc(p.n)}<div class="mu">${esc(p.c)} · ${fmt(p.p)}</div></div><button class="del" data-a="del" data-id="${p.id}">মুছুন</button></div>`).join(""):'<div class="empty">কোনো পণ্য নেই</div>')+`</div>`;
}
function sadd(){
  return `<h2 class="sec">নতুন পণ্য যোগ করুন</h2><div class="box"><form id="sf"><label>পণ্যের নাম<input name="n" required maxlength="50"></label>
  <label>ক্যাটাগরি<select name="c">${CATS.map(c=>`<option>${c[0]}</option>`).join("")}</select></label>
  <label>অবস্থা<select name="k"><option>নতুন</option><option>পুরাতন</option></select></label>
  <label>দাম (টাকা)<input name="p" type="number" min="1" required inputmode="numeric"></label>
  <label>পণ্যের ছবি (ঐচ্ছিক – আসল রঙে দেখাবে)<input name="img" type="file" accept="image/*"></label><button class="btn" type="submit">পণ্য প্রকাশ করুন</button></form></div>`;
}
function sord(){
  const sales=S.orders;
  return `<h2 class="sec">অর্ডার সমূহ</h2>`+orderList(sales);
}
const NAV={buyer:[["home","🏠","হোম"],["cat","🔲","ক্যাটাগরি"],["cart","🛒","কার্ট"],["fav","🤍","পছন্দ"],["profile","👤","প্রোফাইল"]],
seller:[["sdash","📊","ড্যাশবোর্ড"],["sprod","📦","আমার পণ্য"],["sadd","➕","যোগ করুন"],["sord","🧾","অর্ডার"]]};
const VIEWS={home,cat:catTab,cart:cartTab,fav:favTab,profile,sdash,sprod,sadd,sord};
function render(){
  if(!NAV[S.role].some(n=>n[0]===S.tab))S.tab=NAV[S.role][0][0];
  $("#app").innerHTML=head()+VIEWS[S.tab]()+"<nav>"+NAV[S.role].map(n=>`<button data-a="tab" data-t="${n[0]}" class="${S.tab===n[0]?"on":""}"><span>${n[1]}${n[0]==="cart"&&cartN()?`<b class="bdg" style="top:-2px;right:calc(50% - 26px)">${cartN()}</b>`:""}</span>${n[2]}</button>`).join("")+"</nav>";
  const bn=$("#bn");if(bn)bn.addEventListener("scroll",()=>{const i=Math.round(bn.scrollLeft/bn.clientWidth);document.querySelectorAll(".dots i").forEach((d,j)=>d.classList.toggle("on",i===j))});
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,id=+t.dataset.id;
  if(a==="tab"){S.tab=t.dataset.t;S.q="";render();scrollTo(0,0)}
  else if(a==="role"){S.role=t.dataset.r;S.tab=NAV[S.role][0][0];save();render();scrollTo(0,0)}
  else if(a==="cat"){S.cat=t.dataset.c;S.tab="cat";render();scrollTo(0,0)}
  else if(a==="add"){S.cart[id]=(S.cart[id]||0)+1;toast("কার্টে যোগ হয়েছে");render()}
  else if(a==="inc"){S.cart[id]++;render()}
  else if(a==="dec"){if(--S.cart[id]<1)delete S.cart[id];render()}
  else if(a==="fav"){const i=S.favs.indexOf(id);i>-1?S.favs.splice(i,1):S.favs.push(id);save();render()}
  else if(a==="bell"){toast(S.orders.length?"আপনার "+S.orders.length+"টি অর্ডার সম্পন্ন হয়েছে":"নতুন কোনো নোটিফিকেশন নেই")}
  else if(a==="del"){S.products=S.products.filter(p=>p.id!==id);save();toast("পণ্য মুছে ফেলা হয়েছে");render()}
  else if(a==="buy"){
    const lines=[];let sum=0;
    Object.keys(S.cart).forEach(i=>{const p=find(i);if(p){lines.push({id:p.id,n:p.n,c:p.c,p:p.p,q:S.cart[i],s:p.s});sum+=p.p*S.cart[i]}});
    if(!lines.length)return;
    S.orders.unshift({no:S.orders.length+1,at:new Date().toLocaleString("bn-BD",{dateStyle:"short",timeStyle:"short"}),lines:lines,total:sum});
    S.cart={};save();toast("অর্ডার সম্পন্ন: "+fmt(sum));S.tab="profile";render();scrollTo(0,0)}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;render();const i=$("#q");i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
const shrink=file=>new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.82))};im.onerror=rej;im.src=u});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="sf")return;e.preventDefault();const f=new FormData(e.target),file=f.get("img");let img="";
  if(file&&file.size){try{img=await shrink(file)}catch(x){toast("ছবি পড়া যায়নি")}}
  S.products.unshift({id:Date.now(),n:f.get("n"),c:f.get("c"),p:+f.get("p"),r:4.5,rv:0,e:"",img:img,k:f.get("k"),s:SHOP});
  save();toast("পণ্য প্রকাশিত হয়েছে");S.tab="sprod";render();
});
setInterval(()=>{const b=$("#bn");if(b)b.scrollTo({left:((Math.round(b.scrollLeft/b.clientWidth)+1)%3)*b.clientWidth,behavior:"smooth"})},4000);
render();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
